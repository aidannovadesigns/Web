<!--
  MERIDIAN ICON SET — 6 icons, 24×24 viewBox each
  Monolinear, stroke-width="1.5", stroke-linecap="round", stroke-linejoin="round"
  Use as <use href="/brand/icons.svg#icon-process-1"> etc.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- PROCESS 01: Site & Vision — compass/survey icon -->
  <symbol id="icon-process-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <line x1="12" y1="3" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="21"/>
    <line x1="3" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="21" y2="12"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    <line x1="12" y1="12" x2="16" y2="8"/>
  </symbol>

  <!-- PROCESS 02: Design — architectural elevation lines -->
  <symbol id="icon-process-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="19" x2="21" y2="19"/>
    <polyline points="4,19 4,13 8,13 8,9 12,9 12,6 16,6 16,13 20,13 20,19"/>
  </symbol>

  <!-- PROCESS 03: Engineering — structural grid -->
  <symbol id="icon-process-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="12" y1="3" x2="12" y2="21"/>
    <line x1="3" y1="7.5" x2="21" y2="7.5" stroke-width="0.75"/>
    <line x1="3" y1="16.5" x2="21" y2="16.5" stroke-width="0.75"/>
    <line x1="7.5" y1="3" x2="7.5" y2="21" stroke-width="0.75"/>
    <line x1="16.5" y1="3" x2="16.5" y2="21" stroke-width="0.75"/>
  </symbol>

  <!-- PROCESS 04: Build — horizon over foundation -->
  <symbol id="icon-process-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="20" x2="21" y2="20"/>
    <line x1="3" y1="15" x2="21" y2="15"/>
    <polyline points="6,15 6,8 10,4 14,4 18,8 18,15"/>
    <line x1="10" y1="15" x2="10" y2="10"/>
    <line x1="14" y1="15" x2="14" y2="10"/>
    <line x1="10" y1="10" x2="14" y2="10"/>
  </symbol>

  <!-- CONTACT: Email — minimal envelope -->
  <symbol id="icon-email" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="13" rx="0"/>
    <polyline points="3,6 12,14 21,6"/>
  </symbol>

  <!-- CONTACT: Location — pin with horizon -->
  <symbol id="icon-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 C8.1 3 5 6.1 5 10 C5 15 12 21 12 21 C12 21 19 15 19 10 C19 6.1 15.9 3 12 3Z"/>
    <circle cx="12" cy="10" r="2.5"/>
  </symbol>

</svg>
