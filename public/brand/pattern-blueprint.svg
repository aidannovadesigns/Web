<!--
  BLUEPRINT PATTERN — architectural line grid
  Use as CSS background-image or SVG background fill.
  Designed for tiling: width=80 height=80 (10 units × 8px grid)
  Two line weights: major grid (4 divisions) light, minor grid faint
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Minor grid lines — very faint -->
  <g stroke="#1C1C1A" stroke-width="0.3" stroke-opacity="0.06">
    <line x1="20" y1="0" x2="20" y2="80"/>
    <line x1="40" y1="0" x2="40" y2="80"/>
    <line x1="60" y1="0" x2="60" y2="80"/>
    <line x1="0" y1="20" x2="80" y2="20"/>
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="60" x2="80" y2="60"/>
  </g>
  <!-- Diagonal cross-hair — blueprint drafting reference -->
  <g stroke="#1C1C1A" stroke-width="0.2" stroke-opacity="0.04">
    <line x1="0" y1="0" x2="80" y2="80"/>
    <line x1="80" y1="0" x2="0" y2="80"/>
  </g>
</svg>
