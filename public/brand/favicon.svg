<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#1C1C1A"/>
  <!-- Outer frame -->
  <rect x="2" y="2" width="28" height="28" stroke="#F4F1EC" stroke-width="1.2"/>
  <!-- Grid (faint) -->
  <g stroke="#F4F1EC" stroke-width="0.3" stroke-opacity="0.25">
    <line x1="2" y1="11.3" x2="30" y2="11.3"/>
    <line x1="2" y1="16"   x2="30" y2="16"/>
    <line x1="2" y1="20.7" x2="30" y2="20.7"/>
    <line x1="11.3" y1="2" x2="11.3" y2="30"/>
    <line x1="16"   y1="2" x2="16"   y2="30"/>
    <line x1="20.7" y1="2" x2="20.7" y2="30"/>
  </g>
  <!-- M form -->
  <g stroke="#F4F1EC" stroke-width="1.6" stroke-linecap="square">
    <line x1="7"  y1="25" x2="7"  y2="7"/>
    <line x1="7"  y1="7"  x2="16" y2="17"/>
    <line x1="25" y1="7"  x2="16" y2="17"/>
    <line x1="25" y1="7"  x2="25" y2="25"/>
  </g>
</svg>
